apiVersion: n8n.slys.dev/v1alpha1
kind: N8nWorkflow
metadata:
  name: multi-credential-example
spec:
  n8nRef:
    name: n8n-sample
    namespace: default
  workflow:
    name: "Multi-Credential Workflow"
    active: true
    tags: ["multi-credential", "api-integration", "example"]
    nodes:
    - id: "schedule-trigger"
      name: "Schedule Trigger"
      type: "n8n-nodes-base.scheduleTrigger"
      typeVersion: "1.1"
      position: ["240", "300"]
      parameters:
        rule:
          interval:
          - field: "hours"
            hoursInterval: 1
    - id: "api-request-1"
      name: "API Request with API Key"
      type: "n8n-nodes-base.httpRequest"
      typeVersion: "4.1"
      position: ["460", "300"]
      parameters:
        url: "https://api.service1.com/data"
        method: "GET"
        authentication: "headerAuth"
        options:
          timeout: 10000
      credentials:
        httpHeaderAuth: "api-key-cred"
    - id: "api-request-2"
      name: "API Request with Basic Auth"
      type: "n8n-nodes-base.httpRequest"
      typeVersion: "4.1"
      position: ["680", "300"]
      parameters:
        url: "https://api.service2.com/data"
        method: "POST"
        authentication: "basicAuth"
        options:
          timeout: 10000
        bodyParameters:
          parameters:
          - name: "data"
            value: "={{$json}}"
      credentials:
        httpBasicAuth: "basic-auth-cred"
    - id: "merge-data"
      name: "Merge Data"
      type: "n8n-nodes-base.merge"
      typeVersion: "2.0"
      position: ["900", "300"]
      parameters:
        mode: "combine"
        combinationMode: "mergeByPosition"
    connections:
      schedule-trigger:
        main:
        - - node: "api-request-1"
            type: "main"
            index: 0
      api-request-1:
        main:
        - - node: "api-request-2"
            type: "main"
            index: 0
          - node: "merge-data"
            type: "main"
            index: 0
      api-request-2:
        main:
        - - node: "merge-data"
            type: "main"
            index: 1
    settings:
      executionOrder: "v1"
  credentials:
  - name: "api-key-cred"
    type: "httpHeaderAuth"
    secretRef:
      name: "api-key-secret"
      namespace: "default"
  - name: "basic-auth-cred"
    type: "httpBasicAuth"
    secretRef:
      name: "basic-auth-secret"
      namespace: "default"
