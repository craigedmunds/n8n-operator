apiVersion: n8n.slys.dev/v1alpha1
kind: N8nWorkflow
metadata:
  name: sample-scheduled-workflow
  namespace: n8n
spec:
  n8nRef:
    name: n8n
    namespace: n8n
  workflow:
    name: "Sample Scheduled HTTP Request"
    active: true
    tags:
      - sample
      - schedule
      - http
    nodes:
      - id: schedule-trigger
        name: Schedule Trigger
        type: n8n-nodes-base.scheduleTrigger
        typeVersion: 1.3
        position:
          - 240
          - 300
        parameters:
          rule:
            interval:
              - field: hours
      - id: http-request
        name: HTTP Request
        type: n8n-nodes-base.httpRequest
        typeVersion: 4.3
        position:
          - 460
          - 300
        parameters:
          method: GET
          url: https://httpbin.org/get
          options: {}
    connections:
      "Schedule Trigger":
        main:
          - - node: HTTP Request
              type: main
              index: 0
    settings:
      executionOrder: v1
      availableInMCP: false
  credentials:
    - name: sample-api-key
      type: httpHeaderAuth
      secretRef:
        name: sample-api-secret
        namespace: n8n
